- id: sensevoice-small
  kind: asr
  framework: onnx
  format: onnx
  default_device: auto
  compute_type: int8
  source:
    local_path: backend/models/pretrained/sensevoice
    repo_id: FunAudioLLM/SenseVoiceSmall
    files: [model_quant.onnx, tokens.json]
    mirrors: []
  resources: {vram_mb: 800, cpu_threads: 8}
  features: {languages: [zh, en, yue, ja, ko], timestamps: char}

- id: whisper-medium
  kind: asr
  framework: ctranslate2
  format: ct2
  default_device: cuda
  compute_type: int8_float16
  source:
    local_path: models/huggingface/models--Systran--faster-whisper-medium/snapshots/08e178d48790749d25932bbc082711ddcfdfbc4f
    repo_id: Systran/faster-whisper-medium
    files: [model.bin, config.json, tokenizer.json]
  resources: {vram_mb: 2000}
  features: {timestamps: word, languages: multi}

