- id: sensevoice-small
  kind: asr
  framework: onnx
  format: onnx
  default_device: auto
  compute_type: int8
  source:
    local_path: backend/models/pretrained/sensevoice
    repo_id: anchor-flux/sensevoice-small-onnx
    install_mode: mirror
    allow_patterns:
      [
        model_quant.onnx,
        tokens.json,
        configuration.json,
        config.yaml,
        chn_jpn_yue_eng_ko_spectok.bpe.model,
      ]
    files:
      [
        model_quant.onnx,
        tokens.json,
        configuration.json,
        config.yaml,
        chn_jpn_yue_eng_ko_spectok.bpe.model,
      ]
    mirrors: []
  resources: {vram_mb: 800, cpu_threads: 8}
  features: {languages: [zh, en, yue, ja, ko], timestamps: char}

- id: whisper-medium
  kind: asr
  framework: ctranslate2
  format: ct2
  default_device: cuda
  compute_type: int8_float16
  source:
