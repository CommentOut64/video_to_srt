- id: brouhaha-quality
  kind: quality
  framework: torch
  format: pth
  default_device: auto
  compute_type: fp32
  source:
    local_path: backend/models/pretrained/brouhaha
    repo_id: pyannote/brouhaha
    files: [pytorch_model.bin, config.yaml]
  env:
    pip: ["pyannote.audio==3.1.1", "torch==2.1.2"]
  resources: {vram_mb: 1000}

