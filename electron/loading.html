<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnchorFlux 启动中</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: radial-gradient(circle at 20% 20%, #1e293b, #020617 60%);
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .panel {
        width: min(640px, 90vw);
        border-radius: 16px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(8px);
        padding: 28px 30px;
        box-sizing: border-box;
      }
      .title {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 650;
      }
      .subtitle {
        margin: 0 0 20px;
        font-size: 14px;
        color: #94a3b8;
      }
      .status {
        font-size: 16px;
        margin: 0 0 18px;
      }
      .progress {
        height: 4px;
        width: 100%;
        overflow: hidden;
        border-radius: 4px;
        background: rgba(148, 163, 184, 0.2);
      }
      .bar {
        width: 30%;
        height: 100%;
        background: linear-gradient(90deg, #0ea5e9, #22d3ee);
        border-radius: 4px;
        animation: move 1.4s ease-in-out infinite;
      }
      .status-error .bar {
        background: linear-gradient(90deg, #f43f5e, #fb7185);
        animation: none;
        width: 100%;
      }
      @keyframes move {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(380%);
        }
      }
    </style>
  </head>
  <body>
    <div id="panel" class="panel">
      <h1 class="title">AnchorFlux</h1>
      <p class="subtitle">Electron Shell 正在等待后端服务就绪</p>
      <p id="status" class="status">后端启动中，请稍候...</p>
      <div class="progress">
        <div class="bar"></div>
      </div>
    </div>
    <script>
      const panel = document.getElementById("panel");
      const statusText = document.getElementById("status");
      const setStatus = (payload) => {
        if (!payload || !payload.message) {
          return;
        }
        statusText.textContent = payload.message;
        panel.classList.toggle("status-error", payload.status === "error");
      };
      if (window.anchorfluxShell && window.anchorfluxShell.onStatusChange) {
        window.anchorfluxShell.onStatusChange(setStatus);
      }
    </script>
  </body>
</html>
