name: electron-packaging

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  lite_packaging:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Resolve build version
        shell: pwsh
        run: |
          $version = "3.2.4+dev.$(Get-Date -Format yyyyMMdd).01"
          "PKG_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build lite profile
        shell: pwsh
        run: |
          pwsh scripts/packaging/build-profile.ps1 -Profile lite-offline -Artifacts all -Version $env:PKG_VERSION

      - name: Upload lite artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lite-packaging-${{ env.PKG_VERSION }}
          path: dist/releases/lite-offline/${{ env.PKG_VERSION }}
